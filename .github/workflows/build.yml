name: Build

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  pull_request:
  # Actions tab -> Build -> Run workflow. With a tag, the APKs are published
  # as a GitHub release (the tag is created on the selected commit)
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v5.4.3-ew.2 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Upstream pins intl 0.18.1, which requires Flutter 3.19.x
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # widget_test.dart is upstream's unused counter template, so only CashEW's tests run
      - name: Test
        run: flutter test test/daily_log_test.dart

      # Optional: store your firebase.env.json contents in the
      # FIREBASE_ENV_JSON repository secret to enable Firestore features
      - name: Firebase config
        env:
          FIREBASE_ENV_JSON: ${{ secrets.FIREBASE_ENV_JSON }}
        run: |
          if [ -n "$FIREBASE_ENV_JSON" ]; then
            echo "$FIREBASE_ENV_JSON" > firebase.env.json
          else
            echo "{}" > firebase.env.json
          fi

      # Optional but recommended: a stable signing key so updates install over
      # older builds and Google sign-in keeps a fixed SHA-1. Set the
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets.
      # Without them every run is signed with a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          fi

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define-from-file=firebase.env.json

      - name: Build universal APK
        run: flutter build apk --release --dart-define-from-file=firebase.env.json

      # CashEW-<tag or version-commit>-<abi>.apk, plus checksums
      - name: Name APKs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            VERSION="$RELEASE_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')-$(git rev-parse --short HEAD)"
          fi
          DIST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DIST"
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi="${f#app-}"
            abi="${abi%-release.apk}"
            cp "$f" "$DIST/CashEW-$VERSION-$abi.apk"
          done
          cp app-release.apk "$DIST/CashEW-$VERSION-universal.apk"
          cd "$DIST"
          sha256sum *.apk > SHA256SUMS.txt
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: cashew-ew-apk
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: CashEW ${{ inputs.release_tag || github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
